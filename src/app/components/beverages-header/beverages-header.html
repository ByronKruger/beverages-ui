<div nz-flex [nzVertical]="false" class="header-container">
    <div class="logo-container">x</div>
    <div class="nav-container">
      <div nz-flex [nzVertical]="false" nzJustify="space-between" style="width: 100%; height: 64px">
        @if (!authService.currentUser()) {
        <div nz-flex nzGap="8px" nzAlign="center">
          <button nz-button nzType="primary" (click)="onLogin()">Login</button>
          <button nz-button nzType="default" (click)="onRegister()">Register</button>
        </div>
        <!-- <div style="background-color: aliceblue;">{{authService.currentUser() | json}}</div> -->
        } @else {
        <!-- <div style="background-color: aliceblue;">{{authService.currentUser() | json}}</div> -->
        <div>
          <nz-input-group [nzSuffix]="suffixIcon">
            <input
              nzSize="large"
              nz-input
              [formControl]="searchControl"
              placeholder="Search users..."
              [nzAutocomplete]="auto"
              (ngModelChange)="onSearch($event)" 
              style="font-size: 16px;"/>
          </nz-input-group>
          <!-- [(ngModel)]="searchValue" -->
        </div>
        }
        @if (authService.currentUser(); as user) {
        <div nz-flex nzAlign="center" nzGap="8px">
          <div style="color: whitesmoke">
            <span style="margin-right: 8px;"><nz-icon nzType="user" nzTheme="outline"></nz-icon></span>
            <strong>{{ user.email }}</strong>
          </div> <!-- should be username -->
          <button nz-button nzType="text" (click)="onLogout()" nzDanger>
            <nz-icon nzType="logout"/>
            <!-- @if () { -->
            <span>Logout</span>
            <!-- } -->
          </button>
          <!-- <button nz-button nzType="default" (click)="onLogout()">Logout</button> -->
        </div>
        }
      </div>
    </div>
    <div class="right">
    </div>
    <!-- <nz-autocomplete #auto [nzDataSource]="options"> -->
    <!-- <nz-autocomplete #auto>
      <nz-auto-option *ngFor="let option of options | async" [nzValue]="option"
        (selectionChange)="onSearchUserDetails($event, option)">
        {{ option }}
      </nz-auto-option>
    </nz-autocomplete> -->
</div>

<ng-template #suffixIcon>
  <span nz-icon nzType="search" nzTheme="outline"></span>
</ng-template>

<nz-autocomplete #auto>
  <nz-auto-option *ngFor="let option of options | async" [nzValue]="option.id"
    (selectionChange)="onSearchUserDetails($event, option.id)">
    {{ option.firstName + ' ' + option.lastName + ' (' + option.username + ')' }}
  </nz-auto-option>
</nz-autocomplete>
